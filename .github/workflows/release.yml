name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag matches the source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path("app/src/main/scala/com/worxbend/airgradient/Main.scala").read_text()
          version = re.search(r'val Version\s*=\s*"([^"]+)"', source).group(1)
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"])
          assert os.environ["RELEASE_TAG"] == "v" + version
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: airgradient-tui-linux-amd64
          path: artifacts
      - name: Verify and stage the validated Linux amd64 archive
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          mkdir -p release
          cp artifacts/airgradient-tui-scala-*-linux-amd64.tar.gz release/
          (cd release && sha256sum airgradient-tui-scala-*-linux-amd64.tar.gz > SHA256SUMS)
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 🫧 Your air. Your terminal.

          Native executable for **Linux amd64 / x86-64**. No Java installation required.
          Download the archive and `SHA256SUMS` into the same directory, then:

          ```sh
          sha256sum --check SHA256SUMS
          tar -xzf airgradient-tui-scala-*-linux-amd64.tar.gz
          ./airgradient-tui --demo
          ```

          [Project microsite](https://worxbend.github.io/airgradient-tui-scala/) · [Documentation](https://github.com/worxbend/airgradient-tui-scala#readme)

          Validated with synthetic readings, a local mock HTTP server, and real controlling pseudo-terminals. Live AirGradient hardware has not been tested for this application.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "AirGradient TUI $RELEASE_TAG" --notes-file release-notes.md --generate-notes
