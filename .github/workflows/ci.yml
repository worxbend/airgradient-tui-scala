name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
jobs:
  jvm:
    name: JVM / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Select the actual JDK 26 for Mill and its forked tests
        if: matrix.java == '26'
        run: echo "zulu:26" > .mill-jvm-version
      - name: Install terminal-test dependencies
        run: python3 -m pip install --requirement scripts/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('build.mill', '.mill-version') }}
      - name: Formatting
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
      - name: Parser, persistence, HTTP and Glyphora UI tests
        run: ./mill app.test
      - name: Published library boundary
        run: python3 scripts/verify-dependencies.py
      - name: Reproducible actual-renderer captures
        run: python3 scripts/check-snapshots.py
      - name: Package and exercise the JVM application
        run: |
          python3 scripts/package.py
          java --enable-native-access=ALL-UNNAMED -jar dist/airgradient-tui.jar --demo --json
          python3 scripts/smoke-pty.py --jar dist/airgradient-tui.jar
      - name: Upload runnable JAR
        if: matrix.java == '25'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: airgradient-tui-jvm
          path: |
            dist/airgradient-tui.jar
            dist/SHA256SUMS
          if-no-files-found: error
  native:
    name: Native / Linux amd64
    needs: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install terminal-test dependencies
        run: python3 -m pip install --requirement scripts/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: mill-${{ runner.os }}-25-${{ hashFiles('build.mill', '.mill-version') }}
      - name: Build real native executable and stage distribution
        run: python3 scripts/package.py --native
      - name: Exercise the shipped native executable and terminal lifecycle
        run: |
          ./dist/airgradient-tui --demo --json
          python3 scripts/smoke-pty.py --binary dist/airgradient-tui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: airgradient-tui-linux-amd64
          path: |
            dist/airgradient-tui.jar
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
